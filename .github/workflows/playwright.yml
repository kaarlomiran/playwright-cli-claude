name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm run test:evidence
        env:
          BASE_URL: ${{ vars.BASE_URL }}

      # Runs even if the test step above failed, so a red run still
      # publishes its evidence instead of hiding the failure.
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload debug evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-evidence
          path: |
            debug/INDEX.md
            debug/reports/
            debug/traces/
            debug/videos/
            debug/screenshots/
          retention-days: 30

  publish-report:
    name: Publish report to GitHub Pages
    needs: test
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: playwright-report

      - uses: actions/upload-pages-artifact@v3
        with:
          path: playwright-report

      - id: deployment
        uses: actions/deploy-pages@v4
